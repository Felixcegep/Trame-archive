<!-- @dsCard group="Colors" viewport="700x180" name="Accent usage" subtitle="Saturated color for glyphs & text on its own 12% tint" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font:var(--type-body);color:var(--text-body);background:var(--surface-page);padding:16px}.row{display:flex;gap:10px}.sw{border-radius:12px;border:1px solid var(--gym-border);padding:10px;flex:1}.lbl{font:var(--type-caption2);color:var(--text-secondary);margin-top:6px}.hex{font:var(--type-caption-bold);font-variant-numeric:tabular-nums}</style></head><body><div class="row" style="align-items:stretch">
<div class="sw" style="background:var(--surface-card);display:flex;align-items:center;gap:12px">
<div style="width:38px;height:38px;border-radius:50%;background:var(--gym-primary-tint);color:var(--gym-primary);display:flex;align-items:center;justify-content:center;font-weight:700">▸</div>
<div><div style="font:var(--type-subheadline-semibold)">Blue = act now</div><div class="lbl">Buttons, current state, links</div></div></div>
<div class="sw" style="background:var(--surface-card);display:flex;align-items:center;gap:12px">
<div style="width:38px;height:38px;border-radius:50%;background:var(--gym-secondary-tint);color:var(--gym-secondary);display:flex;align-items:center;justify-content:center;font-weight:700">✓</div>
<div><div style="font:var(--type-subheadline-semibold)">Sage = done</div><div class="lbl">Completed sets, saved work</div></div></div>
<div class="sw" style="background:var(--surface-card);display:flex;align-items:center;gap:12px">
<div style="width:38px;height:38px;border-radius:50%;background:var(--gym-accent-tint);color:var(--gym-accent);display:flex;align-items:center;justify-content:center;font-weight:700">◷</div>
<div><div style="font:var(--type-subheadline-semibold)">Tan = context</div><div class="lbl">Dates, history, rest</div></div></div>
</div></body></html>

<!-- @dsCard group="Spacing" viewport="700x180" name="Card anatomy" subtitle="Warm white, hairline border, whisper shadow — cards only for meaningful groups" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font:var(--type-body);color:var(--text-body);background:var(--surface-page);padding:16px}.row{display:flex;gap:10px}.sw{border-radius:12px;border:1px solid var(--gym-border);padding:10px;flex:1}.lbl{font:var(--type-caption2);color:var(--text-secondary);margin-top:6px}.hex{font:var(--type-caption-bold);font-variant-numeric:tabular-nums}</style></head><body><div style="display:flex;gap:12px">
<div style="flex:1;background:var(--surface-card);border:1px solid var(--gym-border);border-radius:20px;box-shadow:var(--shadow-card);padding:16px"><div style="font:var(--type-subheadline-semibold)">Standard card</div><div class="lbl">#FFFCF7 · border 9% · shadow 3% · r20</div></div>
<div style="flex:1;background:var(--gym-current-set-surface);border:1px solid rgba(61,114,226,.42);border-radius:20px;padding:16px"><div style="font:var(--type-subheadline-semibold)">Current / expanded</div><div class="lbl">Blue-gray fill · blue 42% stroke</div></div>
<div style="flex:1;background:var(--gym-secondary-surface);border:1px solid var(--gym-border);border-radius:20px;padding:16px"><div style="font:var(--type-subheadline-semibold)">Completed</div><div class="lbl">Green-gray fill</div></div>
</div></body></html>

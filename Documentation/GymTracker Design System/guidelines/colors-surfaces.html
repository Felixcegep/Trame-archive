<!-- @dsCard group="Colors" viewport="700x160" name="Surface tints" subtitle="Pale desaturated tints carry state — never the saturated color as a fill" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font:var(--type-body);color:var(--text-body);background:var(--surface-page);padding:16px}.row{display:flex;gap:10px}.sw{border-radius:12px;border:1px solid var(--gym-border);padding:10px;flex:1}.lbl{font:var(--type-caption2);color:var(--text-secondary);margin-top:6px}.hex{font:var(--type-caption-bold);font-variant-numeric:tabular-nums}</style></head><body><div class="row">
<div class="sw" style="background:var(--gym-primary-surface)"><div style="height:36px"></div><div class="hex">#E7E9EF</div><div class="lbl">Current set / selected</div></div>
<div class="sw" style="background:var(--gym-secondary-surface)"><div style="height:36px"></div><div class="hex">#E7EAE1</div><div class="lbl">Completed</div></div>
<div class="sw" style="background:var(--gym-accent-surface)"><div style="height:36px"></div><div class="hex">#F2E9DD</div><div class="lbl">Session / rest / plan</div></div>
<div class="sw" style="background:var(--gym-row-surface)"><div style="height:36px"></div><div class="hex">#F2F1EF</div><div class="lbl">Neutral row</div></div>
<div class="sw" style="background:var(--gym-current-set-surface)"><div style="height:36px"></div><div class="hex">#E1E5EF</div><div class="lbl">Active set row</div></div>
</div></body></html>

<!-- @dsCard group="Components" viewport="700x220" name="Forms" subtitle="Search, segmented tabs, set inputs" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page);font:var(--type-body);color:var(--text-body);padding:16px}</style>
</head><body><div id="root"></div><script type="text/babel">
const {SearchField,SegmentedControl,SetInput,StepperRow} = window.GymTrackerDesignSystem_9b15a7;
function Demo(){const [q,setQ]=React.useState("");const [tab,setTab]=React.useState("Workouts");const [reps,setReps]=React.useState("8");const [w,setW]=React.useState("52.5");const [sets,setSets]=React.useState(3);const [dbl,setDbl]=React.useState(true);
return <div style={{display:"flex",flexDirection:"column",gap:14,maxWidth:560}}>
<SearchField value={q} onChange={setQ}/>
<SegmentedControl options={["Workouts","Progress","Records","Balance"]} value={tab} onChange={setTab}/>
<div style={{display:"flex",gap:10,alignItems:"center"}}>
<SetInput value={reps} onChange={setReps} style={{flex:1}}/>
<SetInput value={w} onChange={setW} style={{flex:1}}/>
<SetInput value="120" disabled style={{flex:1}}/>
</div>
<div style={{background:"var(--surface-card)",borderRadius:"var(--radius-card)",overflow:"hidden"}}>
<StepperRow label="Sets" value={sets} onIncrement={()=>setSets(sets+1)} onDecrement={()=>setSets(Math.max(1,sets-1))}/>
<StepperRow label="Target RPE" variant="picker" value="8 - Two reps left"/>
<StepperRow label="Double progression" variant="toggle" on={dbl} onToggle={setDbl} last/>
</div>
</div>;}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
